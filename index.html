<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Steer Show Tracker</title>
<style>
  /* =========================================================
     EDIT YOUR SHOWS IN THE <script> BLOCK AT THE BOTTOM (SHOWS list)
     ========================================================= */
  :root{
    --bg:#f6f2ea; --card:#ffffff; --ink:#2a2118; --muted:#7a6a58;
    --accent:#8b3a1e; --accent2:#c98a2b; --line:#e6ddcf; --good:#3d6b3a; --warn:#b5541c;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#1b1713; --card:#26201a; --ink:#f3ebe0; --muted:#b3a28d;
      --accent:#e07b4f; --accent2:#e2b15a; --line:#3a3027; --good:#8fc28a; --warn:#f0a26a;
    }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:Georgia,"Times New Roman",serif;line-height:1.4}
  .wrap{max-width:900px;margin:0 auto;padding:24px 16px 48px}
  .sans{font-family:system-ui,sans-serif}
  header{text-align:center;margin-bottom:20px}
  header .eyebrow{font-family:system-ui,sans-serif;letter-spacing:.18em;
    text-transform:uppercase;font-size:12px;color:var(--muted)}
  header h1{margin:6px 0 0;font-size:clamp(26px,5vw,40px)}
  .today{font-family:system-ui,sans-serif;font-size:14px;color:var(--muted);margin-top:4px}

  .panel{background:var(--card);border:1px solid var(--line);border-radius:16px;
    padding:20px;box-shadow:0 2px 10px rgba(0,0,0,.05)}
  .hero{text-align:center;padding:28px 20px}
  .hero .label{font-family:system-ui,sans-serif;font-size:13px;letter-spacing:.12em;
    text-transform:uppercase;color:var(--accent)}
  .hero h2{margin:6px 0 2px;font-size:clamp(22px,4vw,30px)}
  .hero .where{font-family:system-ui,sans-serif;color:var(--muted);font-size:15px}
  .big{font-size:clamp(84px,20vw,150px);font-weight:700;line-height:1;
    color:var(--accent);margin:18px 0 0}
  .bigsub{font-family:system-ui,sans-serif;font-size:18px;color:var(--muted);
    text-transform:uppercase;letter-spacing:.15em}
  .clock{display:flex;justify-content:center;gap:10px;margin-top:18px;flex-wrap:wrap}
  .clock div{min-width:70px;background:var(--bg);border:1px solid var(--line);
    border-radius:10px;padding:8px 6px}
  .clock b{display:block;font-size:24px;font-variant-numeric:tabular-nums}
  .clock span{font-family:system-ui,sans-serif;font-size:11px;color:var(--muted);
    text-transform:uppercase;letter-spacing:.1em}
  .bar{height:10px;background:var(--line);border-radius:99px;margin:22px auto 6px;
    max-width:520px;overflow:hidden}
  .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent2),var(--accent));
    border-radius:99px;transition:width .6s}
  .barlbl{font-family:system-ui,sans-serif;font-size:12px;color:var(--muted)}
  .note{font-family:system-ui,sans-serif;font-size:14px;margin-top:12px}

  h3{font-family:system-ui,sans-serif;font-size:13px;letter-spacing:.14em;
    text-transform:uppercase;color:var(--muted);margin:30px 0 10px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px}
  .card .n{font-weight:700;font-size:17px}
  .card .m{font-family:system-ui,sans-serif;font-size:13px;color:var(--muted)}
  .card .d{text-align:right;flex-shrink:0}
  .card .d b{display:block;font-size:30px;color:var(--accent);line-height:1}
  .card .d span{font-family:system-ui,sans-serif;font-size:11px;color:var(--muted);
    text-transform:uppercase;letter-spacing:.08em}
  .past .card{opacity:.55}
  .past .card .d b{color:var(--good);font-size:16px}
  .empty{text-align:center;font-family:system-ui,sans-serif;color:var(--muted);padding:24px}
  details summary{cursor:pointer;font-family:system-ui,sans-serif;font-size:13px;
    letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:30px 0 10px}

  /* ---- weights ---- */
  form.row{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
  form.row label{display:flex;flex-direction:column;font-family:system-ui,sans-serif;
    font-size:12px;color:var(--muted);gap:4px;flex:1 1 130px}
  input,select{font:16px system-ui,sans-serif;padding:9px 10px;border-radius:8px;
    border:1px solid var(--line);background:var(--bg);color:var(--ink);width:100%}
  button{font:600 14px system-ui,sans-serif;padding:10px 16px;border-radius:8px;border:0;
    background:var(--accent);color:#fff;cursor:pointer}
  button.ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}
  button.tiny{padding:3px 8px;font-size:12px;font-weight:500}
  .msg{font-family:system-ui,sans-serif;font-size:13px;color:var(--good);min-height:18px;margin-top:8px}
  .steers{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
  .steer{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
  .steer .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
  .steer .nm{font-weight:700;font-size:19px}
  .steer .own{font-family:system-ui,sans-serif;font-size:13px;color:var(--muted)}
  .steer .wt{font-size:34px;font-weight:700;color:var(--accent);line-height:1;margin-top:10px}
  .steer .wt small{font:14px system-ui,sans-serif;color:var(--muted)}
  .stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px;
    font-family:system-ui,sans-serif}
  .stats div{background:var(--bg);border-radius:8px;padding:7px 9px}
  .stats span{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
  .stats b{font-size:16px}
  .stats .bad{color:var(--warn)} .stats .ok{color:var(--good)}
  svg.spark{width:100%;height:70px;margin-top:12px;display:block}
  table{width:100%;border-collapse:collapse;font:13px system-ui,sans-serif;margin-top:6px}
  td,th{padding:5px 4px;border-bottom:1px solid var(--line);text-align:left}
  th{color:var(--muted);font-weight:500}
  .steer details summary{margin:12px 0 0;font-size:11px}
  .tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
  .fine{font-family:system-ui,sans-serif;font-size:12px;color:var(--muted);margin-top:10px}
  .tshow{font-family:system-ui,sans-serif;font-size:13px;color:var(--accent2);margin-top:4px}
  .tools select{width:auto;font-size:13px;padding:4px 8px}
  .hoof{margin-top:12px;font-family:system-ui,sans-serif;font-size:13px;background:var(--bg);
    border-radius:8px;padding:8px 10px;display:flex;flex-direction:column;gap:2px}
  .hoof b{font-size:14px}
  .hoof .ok{color:var(--good)} .hoof .bad{color:var(--warn)} .hoof .muted{color:var(--muted)}
  .vet{margin-top:8px;font-family:system-ui,sans-serif;font-size:13px;background:var(--bg);
    border-radius:8px;padding:8px 10px;display:flex;flex-direction:column;gap:2px}
  .vet .ok{color:var(--good)} .vet .bad{color:var(--warn)} .vet .muted{color:var(--muted)}
  .sub{font:600 11px system-ui,sans-serif;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-top:12px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">Show Season</div>
    <h1 id="title"></h1>
    <div class="today" id="today"></div>
  </header>

  <section class="panel hero" id="hero"></section>

  <!-- ===== WEIGHTS ===== -->
  <h3>Log a weight</h3>
  <div class="panel">
    <form class="row" id="wForm">
      <label>Steer<select id="wSteer" required></select></label>
      <label>Date<input type="date" id="wDate" required></label>
      <label>Weight (lb)<input type="number" id="wLbs" min="50" max="2500" step="1" inputmode="numeric" required></label>
      <button type="button" id="wBtn">Save weight</button>
    </form>
    <div class="msg" id="wMsg"></div>

    <details>
      <summary>+ Add a steer</summary>
      <form class="row" id="sForm">
        <label>Steer name / tag<input id="sName" required></label>
        <label>Exhibitor<input id="sOwner" placeholder="optional"></label>
        <label>Target show weight (lb)<input type="number" id="sTarget" min="0" step="5" inputmode="numeric" placeholder="optional"></label>
        <label>Target show<select id="sShow"></select></label>
        <label>Trim hooves (days before show)<input type="number" id="sLead" min="0" max="120" step="1" inputmode="numeric" placeholder="optional"></label>
        <button type="button" id="sBtn">Add steer</button>
      </form>
      <div class="msg" id="sMsg"></div>
    </details>
  </div>

  <h3>Log a hoof trim</h3>
  <div class="panel">
    <form class="row" id="tForm">
      <label>Steer<select id="tSteer"></select></label>
      <label>Date trimmed<input type="date" id="tDate"></label>
      <label>Note<input id="tNote" placeholder="optional — e.g. all four, fronts only"></label>
      <button type="button" id="tBtn">Save trim</button>
    </form>
    <div class="msg" id="tMsg"></div>
  </div>

  <h3>Vet log</h3>
  <div class="panel">
    <form class="row" id="vForm">
      <label>Steer<select id="vSteer"></select></label>
      <label>Date<input type="date" id="vDate"></label>
      <label>Type<select id="vType">
        <option>Vaccination</option><option>Deworming</option><option>Treatment</option>
        <option>Exam / check</option><option>Health papers</option><option>Other</option>
      </select></label>
      <label>Product / what was done<input id="vProduct" placeholder="e.g. product name, dose, route"></label>
      <label>Withdrawal (days)<input type="number" id="vWd" min="0" max="365" step="1" inputmode="numeric" placeholder="0 if none"></label>
      <label>Vet / notes<input id="vNote" placeholder="optional"></label>
      <button type="button" id="vBtn">Save vet entry</button>
    </form>
    <div class="msg" id="vMsg"></div>
  </div>

  <h3>Steers</h3>
  <div class="steers" id="steers"></div>
  <div class="tools">
    <button class="ghost" id="expBtn" type="button">Export CSV</button>
    <button class="ghost" id="impBtn" type="button">Import CSV</button>
    <input type="file" id="impFile" accept=".csv,text/csv" hidden>
  </div>
  <div class="fine" id="syncStatus">Loading…</div>

  <h3>All upcoming shows</h3>
  <div class="grid" id="upcoming"></div>

  <details id="pastWrap" hidden>
    <summary>Completed shows</summary>
    <div class="grid past" id="past"></div>
  </details>
</div>

<script>
/* =========================================================
   EDIT HERE — one line per show.
   date: "YYYY-MM-DD" of the steer show
   time: "HH:MM" 24-hour (optional; used for the live clock)
   ========================================================= */
const TITLE = "McMurphy Show Steers";
const SHOWS = [
  { name: "Sand Hills Stock Show & Rodeo", location: "Odessa, TX", date: "2027-01-09", time: "", note: "Steer show" },
  { name: "Fort Worth Stock Show & Rodeo", location: "Fort Worth, TX", date: "2027-02-04", time: "", note: "Steer show" },
  { name: "San Antonio Stock Show & Rodeo", location: "San Antonio, TX", date: "2027-02-24", time: "", note: "Steer show" },
  { name: "Rodeo Austin", location: "Austin, TX", date: "2027-03-11", time: "", note: "Steer show" },
  { name: "Houston Livestock Show and Rodeo", location: "Houston, TX", date: "2027-03-15", time: "", note: "Steer show" },
];
/* Shared-save address (the Cloudflare Worker). Leave as-is if the Worker
   is routed to canyoncattleconsulting.com/api/steers. */
const API = "/api/steers";
/* ========================================================= */

const DAY = 86400000;
const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2,"0");
const esc = s => String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function parseDate(s, t){
  const [y,m,d] = s.split("-").map(Number);
  const [hh,mm] = (t||"00:00").split(":").map(Number);
  return new Date(y, m-1, d, hh||0, mm||0);
}
const midnight = dt => new Date(dt.getFullYear(), dt.getMonth(), dt.getDate());
const dayDiff = (a,b) => Math.round((midnight(b) - midnight(a)) / DAY); // b - a, in days
const daysUntil = (show, now) => dayDiff(now, parseDate(show.date));
const fmt = dt => dt.toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric",year:"numeric"});
const fmtShort = dt => dt.toLocaleDateString(undefined,{month:"short",day:"numeric"});
const isoToday = () => { const d=new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const clone = o => JSON.parse(JSON.stringify(o));

const shows = SHOWS.slice().sort((a,b)=>parseDate(a.date)-parseDate(b.date));
const nextShow = () => shows.find(s => daysUntil(s, new Date()) >= 0);
// A steer's chosen show if it's still upcoming; otherwise the next show on the calendar.
const steerShow = st => {
  const pick = st.show && shows.find(x => x.name === st.show && daysUntil(x, new Date()) >= 0);
  return pick || nextShow();
};

/* =========================================================
   DATA + SHARED SYNC
   Every change is recorded as a small "operation". Operations are
   applied locally right away, then sent to the shared database. If
   someone else saved in the meantime, the page pulls their version,
   re-applies its own changes on top, and saves again — so two people
   entering weights at once never wipe each other out.
   ========================================================= */
const EMPTY = () => ({ steers: [], weights: [], trims: [], vet: [] });
const CACHE = "steerTracker.v2";      // this device's copy + unsent changes
const OLD = "steerTracker.v1";        // earlier version of the page (this device only)
const PINKEY = "steerTracker.pin";

let base = { version: 0, data: EMPTY() };  // last copy confirmed by the server
let pending = [];                           // changes not yet saved to the server
let db = EMPTY();                           // what's on screen = base + pending
let syncState = "local";                    // synced | saving | offline | local | locked

function store(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
function fetchLocal(k){ try{ const r = localStorage.getItem(k); return r ? JSON.parse(r) : null; }catch(e){ return null; } }
function getPin(){ try{ return localStorage.getItem(PINKEY) || ""; }catch(e){ return ""; } }
function setPin(p){ try{ localStorage.setItem(PINKEY, p); }catch(e){} }

function applyOp(d, op){
  const steer = id => d.steers.find(s=>s.id===id);
  switch(op.t){
    case "addSteer": if(!steer(op.steer.id)) d.steers.push(op.steer); break;
    case "removeSteer":
      d.steers = d.steers.filter(s=>s.id!==op.id);
      d.weights = d.weights.filter(w=>w.steerId!==op.id);
      d.trims = d.trims.filter(t=>t.steerId!==op.id);
      d.vet = d.vet.filter(v=>v.steerId!==op.id); break;
    case "addVet": if(steer(op.v.steerId) && !d.vet.some(x=>x.id===op.v.id)) d.vet.push(op.v); break;
    case "delVet": d.vet = d.vet.filter(v=>v.id!==op.id); break;
    case "setLead":   { const s = steer(op.id); if(s) s.trimLead = op.lead; break; }
    case "addTrim": {
      if(!steer(op.tr.steerId)) break;
      const dup = d.trims.find(t=>t.steerId===op.tr.steerId && t.date===op.tr.date);
      if(dup) dup.note = op.tr.note; else d.trims.push(op.tr);
      break;
    }
    case "delTrim": d.trims = d.trims.filter(t=>t.id!==op.id); break;
    case "setTarget": { const s = steer(op.id); if(s) s.target = op.target; break; }
    case "setShow":   { const s = steer(op.id); if(s) s.show = op.show; break; }
    case "addWeight": {
      if(!steer(op.w.steerId)) break;
      const dup = d.weights.find(w=>w.steerId===op.w.steerId && w.date===op.w.date);
      if(dup) dup.lbs = op.w.lbs; else d.weights.push(op.w);
      break;
    }
    case "delWeight": d.weights = d.weights.filter(w=>w.id!==op.id); break;
    case "importRows":
      op.rows.forEach(r=>{
        let s = d.steers.find(x=>x.name.toLowerCase()===r.name.toLowerCase());
        if(!s){ s = { id: r.newSteerId, name: r.name, owner: r.owner||"", target: r.target||null, show: "" }; d.steers.push(s); }
        if(r.show) s.show = r.show;
        if(r.lead) s.trimLead = r.lead;
        if(r.record==="vet"){ if(r.date) applyOp(d, { t:"addVet", v:{ id:r.newWeightId, steerId:s.id, date:r.date, type:r.vtype||"Other", product:r.product||"", withdraw:r.wd||0, note:r.note||"" } }); return; }
        if(r.record==="trim"){ if(r.date) applyOp(d, { t:"addTrim", tr:{ id:r.newWeightId, steerId:s.id, date:r.date, note:r.note||"" } }); return; }
        if(r.date && r.lbs) applyOp(d, { t:"addWeight", w:{ id:r.newWeightId, steerId:s.id, date:r.date, lbs:r.lbs } });
      });
      break;
    case "mergeAll": // bring in data from the older single-device version
      (op.data.steers||[]).forEach(s=>{ if(!steer(s.id)) d.steers.push(s); });
      (op.data.weights||[]).forEach(w=>{ if(!d.weights.some(x=>x.id===w.id)) applyOp(d,{t:"addWeight",w}); });
      (op.data.vet||[]).forEach(v=>{ if(!d.vet.some(x=>x.id===v.id)) applyOp(d,{t:"addVet",v}); });
      (op.data.trims||[]).forEach(tr=>{ if(!d.trims.some(x=>x.id===tr.id)) applyOp(d,{t:"addTrim",tr}); });
      break;
  }
  return d;
}
function rebuild(){
  const d = clone(base.data);
  d.steers = d.steers||[]; d.weights = d.weights||[]; d.trims = d.trims||[]; d.vet = d.vet||[];
  pending.forEach(op => applyOp(d, op));
  db = d;
}
function persist(){ store(CACHE, { base, pending }); }

function setStatus(s, extra){
  syncState = s;
  const el = $("syncStatus"); if(!el) return;
  const txt = {
    synced:  "✓ Saved — shared with every device",
    saving:  "Saving…",
    offline: "No connection — saved on this device, will share when back online",
    local:   "Shared saving isn't set up yet — saved on this device only",
    locked:  "Wrong or missing family PIN — changes saved on this device only. Tap to enter PIN."
  }[s];
  el.textContent = extra || txt;
  el.style.color = s==="synced" ? "var(--good)" : (s==="saving" ? "var(--muted)" : "var(--warn)");
  el.style.cursor = s==="locked" ? "pointer" : "default";
}

async function pull(){
  try{
    const r = await fetch(API, { cache: "no-store" });
    if(r.status===404){ setStatus("local"); return false; }
    if(!r.ok) throw new Error(r.status);
    const j = await r.json();
    if(typeof j.version!=="number" || !j.data) { setStatus("local"); return false; }
    if(j.version !== base.version){
      base = { version: j.version, data: { steers: j.data.steers||[], weights: j.data.weights||[], trims: j.data.trims||[], vet: j.data.vet||[] } };
      const before = JSON.stringify(db);
      rebuild(); persist();
      if(JSON.stringify(db)!==before) renderSteers();
    }
    if(!pending.length) setStatus("synced");
    return true;
  }catch(e){ setStatus("offline"); return false; }
}

let pushing = false;
async function push(){
  if(pushing || !pending.length) return;
  pushing = true; setStatus("saving");
  try{
    for(let tries=0; tries<5 && pending.length; tries++){
      const sending = pending.slice();
      const data = clone(base.data); data.trims = data.trims||[]; data.vet = data.vet||[]; sending.forEach(op=>applyOp(data, op));
      const r = await fetch(API, {
        method: "PUT",
        headers: { "Content-Type": "application/json", "X-Family-Pin": getPin() },
        body: JSON.stringify({ baseVersion: base.version, data })
      });
      if(r.status===404){ setStatus("local"); return; }
      if(r.status===401){
        setStatus("locked");
        if(!push.asked){ // ask once per visit; after that, tap the status line
          push.asked = true;
          const p = prompt("Enter the family PIN to save changes for everyone:", "");
          if(p){ setPin(p.trim()); pushing = false; return push(); }
        }
        return;
      }
      if(r.status===409){ // someone else saved first: take theirs, re-apply ours, try again
        const j = await r.json();
        base = { version: j.version, data: j.data };
        rebuild(); persist(); renderSteers();
        continue;
      }
      if(!r.ok) throw new Error(r.status);
      const j = await r.json();
      base = { version: j.version, data };
      pending = pending.slice(sending.length);
      rebuild(); persist();
    }
    setStatus(pending.length ? "offline" : "synced");
  }catch(e){ setStatus("offline"); }
  finally{ pushing = false; }
}

function change(op, msg){
  pending.push(op);
  applyOp(db, op);
  persist(); renderSteers();
  if(msg) flash(msg);
  push();
}

function loadLocal(){
  const c = fetchLocal(CACHE);
  if(c && c.base && c.base.data){ base = c.base; pending = c.pending||[]; }
  // carry over anything entered with the earlier single-device version
  const old = fetchLocal(OLD);
  if(old && (old.steers||[]).length){
    pending.push({ t:"mergeAll", data: old });
    try{ localStorage.removeItem(OLD); }catch(e){}
  }
  rebuild(); persist();
}

function flash(t, bad){
  ["wMsg","sMsg","tMsg","vMsg"].forEach(id=>{ const m=$(id); if(!m) return; m.textContent=t; m.style.color = bad ? "var(--warn)" : "var(--good)"; });
  clearTimeout(flash._t); flash._t = setTimeout(()=>{ ["wMsg","sMsg","tMsg","vMsg"].forEach(id=>$(id).textContent=""); }, 4000);
}

/* ---------------- countdown ---------------- */
let lastKey = "";
function renderCountdown(){
  const now = new Date();
  $("title").textContent = TITLE;
  $("today").textContent = "Today is " + now.toLocaleDateString(undefined,{weekday:"long",month:"long",day:"numeric",year:"numeric"});

  const up = shows.filter(s => daysUntil(s, now) >= 0);
  const past = shows.filter(s => daysUntil(s, now) < 0).reverse();
  const next = up[0];

  if(!next){
    $("hero").innerHTML = `<div class="empty">No upcoming shows on the list. Add the next one to the SHOWS list.</div>`;
  } else {
    const d = daysUntil(next, now);
    let ms = Math.max(0, parseDate(next.date, next.time) - now);
    const cd = Math.floor(ms/DAY); ms -= cd*DAY;
    const ch = Math.floor(ms/3600000); ms -= ch*3600000;
    const cm = Math.floor(ms/60000); ms -= cm*60000;
    const cs = Math.floor(ms/1000);

    const prev = past[0];
    const start = prev ? midnight(parseDate(prev.date)) : new Date(midnight(parseDate(next.date)) - 120*DAY);
    const total = midnight(parseDate(next.date)) - start;
    const pct = Math.min(100, Math.max(0, (midnight(now) - start) / total * 100));

    const big = d === 0 ? "🏆" : d;
    const sub = d === 0 ? "Show day — good luck!" : (d === 1 ? "day to go" : "days to go");
    const weeks = d >= 14 ? ` · about ${Math.floor(d/7)} weeks` : "";

    $("hero").innerHTML = `
      <div class="label">Next show</div>
      <h2>${esc(next.name)}</h2>
      <div class="where">${esc(next.location)} · ${fmt(parseDate(next.date))}</div>
      <div class="big">${big}</div>
      <div class="bigsub">${sub}${weeks}</div>
      ${d > 0 ? `<div class="clock">
        <div><b>${cd}</b><span>days</span></div>
        <div><b>${pad(ch)}</b><span>hours</span></div>
        <div><b>${pad(cm)}</b><span>min</span></div>
        <div><b>${pad(cs)}</b><span>sec</span></div>
      </div>` : ""}
      <div class="bar"><i style="width:${pct.toFixed(1)}%"></i></div>
      <div class="barlbl">${prev ? "Since " + esc(prev.name) : "Final 120 days"} · ${Math.round(pct)}% of the way there</div>
      ${next.note ? `<div class="note">${esc(next.note)}</div>` : ""}`;
  }

  const key = midnight(now).toDateString();
  if(key !== lastKey){
    lastKey = key;
    $("upcoming").innerHTML = up.length ? up.map(s=>{
      const d = daysUntil(s, now);
      return `<div class="card">
        <div><div class="n">${esc(s.name)}</div>
        <div class="m">${esc(s.location)}<br>${fmt(parseDate(s.date))}</div></div>
        <div class="d"><b>${d===0?"Today":d}</b><span>${d===0?"":(d===1?"day":"days")}</span></div>
      </div>`;}).join("") : `<div class="empty">Nothing scheduled.</div>`;
    $("pastWrap").hidden = !past.length;
    $("past").innerHTML = past.map(s=>`<div class="card">
        <div><div class="n">${esc(s.name)}</div>
        <div class="m">${esc(s.location)}<br>${fmt(parseDate(s.date))}</div></div>
        <div class="d"><b>✓ Shown</b></div></div>`).join("");
    renderSteers(); // projections depend on the date
  }
}

/* ---------------- weights ---------------- */
function trimsFor(id){
  return db.trims.filter(t=>t.steerId===id).sort((a,b)=>a.date.localeCompare(b.date));
}
const addDays = (dt, n) => new Date(dt.getFullYear(), dt.getMonth(), dt.getDate()+n);
const plural = (n,w) => `${n} ${w}${n===1?"":"s"}`;
function hoofBox(s, show){
  const ts = trimsFor(s.id), today = new Date();
  const doneTrims = ts.filter(t=>dayDiff(parseDate(t.date), today) >= 0);   // on or before today
  const booked = ts.filter(t=>dayDiff(parseDate(t.date), today) < 0);       // future dates = scheduled
  const last = doneTrims[doneTrims.length-1];
  const lines = [];
  lines.push(last
    ? `<div>Last trimmed <b>${fmtShort(parseDate(last.date))}</b> <span class="muted">· ${dayDiff(parseDate(last.date),today)===0?"today":plural(dayDiff(parseDate(last.date),today),"day")+" ago"}${last.note?" · "+esc(last.note):""}</span></div>`
    : `<div class="muted">No trims logged yet</div>`);
  if(booked.length) lines.push(`<div>Scheduled <b>${fmtShort(parseDate(booked[0].date))}</b> <span class="muted">· in ${plural(dayDiff(today,parseDate(booked[0].date)),"day")}${booked[0].note?" · "+esc(booked[0].note):""}</span></div>`);
  if(show && s.trimLead!=null && s.trimLead!==""){
    const showD = parseDate(show.date), target = addDays(showD, -s.trimLead);
    // counts as "trimmed for this show" if done within a week before the target date, up to show day
    const windowStart = addDays(target, -7);
    const inWindow = t=>{ const d=parseDate(t.date); return d>=windowStart && d<=showD; };
    const done = doneTrims.find(inWindow), planned = booked.find(inWindow);
    const until = dayDiff(today, target);
    let status;
    if(!done && planned) status = `<b class="ok">Scheduled for ${esc(show.name)}</b> <span class="muted">(${fmtShort(parseDate(planned.date))})</span>`;
    else if(done) status = `<b class="ok">✓ Trimmed for ${esc(show.name)}</b> <span class="muted">(${fmtShort(parseDate(done.date))})</span>`;
    else if(until > 0) status = `Trim target <b>${fmtShort(target)}</b> <span class="muted">· in ${plural(until,"day")}</span>`;
    else if(until === 0) status = `<b class="bad">Trim today</b> <span class="muted">· ${s.trimLead} days before ${esc(show.name)}</span>`;
    else status = `<b class="bad">Trim overdue</b> <span class="muted">· target was ${fmtShort(target)}</span>`;
    lines.push(`<div>${status}</div><div class="muted">Target: ${plural(Number(s.trimLead),"day")} before ${esc(show.name)}</div>`);
  } else {
    lines.push(`<div class="muted">No trim target set</div>`);
  }
  return `<div class="hoof">🦶 ${lines.join("")}</div>`;
}

function vetFor(id){
  return db.vet.filter(v=>v.steerId===id).sort((a,b)=>a.date.localeCompare(b.date));
}
const clearDate = v => addDays(parseDate(v.date), Number(v.withdraw)||0);
function vetBox(s, show){
  const vs = vetFor(s.id), today = new Date();
  if(!vs.length) return `<div class="vet">🩺 <div class="muted">No vet entries yet</div></div>`;
  const last = vs[vs.length-1];
  const lines = [`<div>Last: <b>${esc(last.type)}</b> ${fmtShort(parseDate(last.date))}${last.product?` <span class="muted">· ${esc(last.product)}</span>`:""}</div>`];
  // withdrawal: the latest clear date across every entry that has one
  const wd = vs.filter(v=>Number(v.withdraw)>0).map(v=>({v, clear: clearDate(v)})).sort((a,b)=>b.clear-a.clear)[0];
  if(wd){
    const showD = show ? parseDate(show.date) : null;
    if(dayDiff(today, wd.clear) > 0){
      lines.push(`<div><b class="bad">In withdrawal until ${fmtShort(wd.clear)}</b> <span class="muted">· ${esc(wd.v.product||wd.v.type)}</span></div>`);
    } else {
      lines.push(`<div><b class="ok">✓ Clear of withdrawal</b> <span class="muted">since ${fmtShort(wd.clear)}</span></div>`);
    }
    if(showD){
      lines.push(wd.clear > showD
        ? `<div><b class="bad">⚠ Not clear by ${esc(show.name)}</b> <span class="muted">(${fmtShort(showD)})</span></div>`
        : `<div class="muted">Clear before ${esc(show.name)}</div>`);
    }
  }
  return `<div class="vet">🩺 ${lines.join("")}</div>`;
}

function weightsFor(id){
  return db.weights.filter(w=>w.steerId===id).sort((a,b)=>a.date.localeCompare(b.date));
}
const num = n => Math.round(n).toLocaleString();
const adgTxt = n => (n>=0?"":"−") + Math.abs(n).toFixed(2);

function spark(ws, target){
  if(ws.length < 2) return "";
  const W=300,H=70,P=6;
  const t0 = parseDate(ws[0].date), t1 = parseDate(ws[ws.length-1].date);
  const span = Math.max(1, t1 - t0);
  let lo = Math.min(...ws.map(w=>w.lbs)), hi = Math.max(...ws.map(w=>w.lbs));
  if(target){ lo = Math.min(lo,target); hi = Math.max(hi,target); }
  const r = Math.max(1, hi-lo);
  const x = d => P + (parseDate(d)-t0)/span*(W-2*P);
  const y = v => H-P - (v-lo)/r*(H-2*P);
  const pts = ws.map(w=>`${x(w.date).toFixed(1)},${y(w.lbs).toFixed(1)}`).join(" ");
  const tl = target ? `<line x1="${P}" x2="${W-P}" y1="${y(target)}" y2="${y(target)}" stroke="var(--accent2)" stroke-dasharray="4 4" stroke-width="1.5"/>` : "";
  const dots = ws.map(w=>`<circle cx="${x(w.date)}" cy="${y(w.lbs)}" r="3" fill="var(--accent)"/>`).join("");
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-label="Weight trend">${tl}
    <polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round"/>${dots}</svg>`;
}

function renderSteers(){
  // remember which history panels are open so a refresh doesn't close them
  const open = new Set([...document.querySelectorAll(".steer details[open]")].map(x=>x.dataset.sid));

  const sel = $("wSteer"), keep = sel.value;
  sel.innerHTML = db.steers.length
    ? db.steers.map(s=>`<option value="${s.id}">${esc(s.name)}${s.owner?" ("+esc(s.owner)+")":""}</option>`).join("")
    : `<option value="">Add a steer first</option>`;
  if(db.steers.some(s=>s.id===keep)) sel.value = keep;
  const tsel = $("tSteer"), tkeep = tsel.value;
  tsel.innerHTML = sel.innerHTML;
  if(db.steers.some(s=>s.id===tkeep)) tsel.value = tkeep;
  const vsel = $("vSteer"), vkeep = vsel.value;
  vsel.innerHTML = sel.innerHTML;
  if(db.steers.some(s=>s.id===vkeep)) vsel.value = vkeep;

  const upShows = shows.filter(x => daysUntil(x, new Date()) >= 0);
  const showOpts = cur => `<option value="">Next show (auto)</option>` + upShows.map(x=>
    `<option value="${esc(x.name)}"${x.name===cur?" selected":""}>${esc(x.name)} · ${fmtShort(parseDate(x.date))}</option>`).join("");
  const sShow = $("sShow"), keepShow = sShow.value;
  sShow.innerHTML = showOpts(keepShow);

  $("steers").innerHTML = db.steers.length ? db.steers.map(s=>{
    const show = steerShow(s);
    const showDate = show ? parseDate(show.date) : null;
    const ws = weightsFor(s.id);
    const last = ws[ws.length-1], prev = ws[ws.length-2], first = ws[0];
    let stats = "";
    if(last){
      const recentAdg = prev ? (last.lbs-prev.lbs)/Math.max(1,dayDiff(parseDate(prev.date),parseDate(last.date))) : null;
      const allAdg = ws.length>1 ? (last.lbs-first.lbs)/Math.max(1,dayDiff(parseDate(first.date),parseDate(last.date))) : null;
      const dToShow = showDate ? dayDiff(parseDate(last.date), showDate) : null;
      const proj = (recentAdg!==null && dToShow!==null && dToShow>=0) ? last.lbs + recentAdg*dToShow : null;
      const need = (s.target && dToShow>0) ? (s.target-last.lbs)/dToShow : null;
      const cells = [];
      if(recentAdg!==null) cells.push(`<div><span>ADG since last</span><b>${adgTxt(recentAdg)}</b></div>`);
      if(allAdg!==null) cells.push(`<div><span>ADG overall</span><b>${adgTxt(allAdg)}</b></div>`);
      if(proj!==null) cells.push(`<div><span>Proj. at ${esc(show.name)}</span><b class="${s.target ? (Math.abs(proj-s.target)<=25?"ok":"bad") : ""}">${num(proj)} lb</b></div>`);
      if(s.target) cells.push(`<div><span>Target</span><b>${num(s.target)} lb</b></div>`);
      if(need!==null) cells.push(`<div><span>ADG needed for target</span><b class="${recentAdg!==null && Math.abs(need-recentAdg)<=0.5?"ok":"bad"}">${adgTxt(need)}</b></div>`);
      if(dToShow!==null && dToShow>=0) cells.push(`<div><span>Days to show</span><b>${dToShow}</b></div>`);
      stats = `<div class="stats">${cells.join("")}</div>`;
    }
    const rows = ws.slice().reverse().map((w,i,arr)=>{
      const p = arr[i+1];
      const g = p ? (w.lbs-p.lbs)/Math.max(1,dayDiff(parseDate(p.date),parseDate(w.date))) : null;
      return `<tr><td>${fmtShort(parseDate(w.date))}, ${w.date.slice(0,4)}</td><td>${num(w.lbs)}</td>
        <td>${g===null?"—":adgTxt(g)}</td><td><button class="ghost tiny" data-delw="${w.id}">✕</button></td></tr>`;
    }).join("");
    return `<div class="steer">
      <div class="top"><div class="nm">${esc(s.name)}</div><div class="own">${esc(s.owner||"")}</div></div>
      <div class="tshow">${show ? `🎯 ${esc(show.name)} · ${fmtShort(parseDate(show.date))} · ${daysUntil(show,new Date())} days${s.show?"":" (next show)"}` : "No upcoming show"}</div>
      ${last ? `<div class="wt">${num(last.lbs)} <small>lb · ${fmtShort(parseDate(last.date))}</small></div>`
             : `<div class="fine">No weights yet — log one above.</div>`}
      ${stats}
      ${spark(ws, s.target)}
      ${hoofBox(s, show)}
      ${vetBox(s, show)}
      <details data-sid="${s.id}"${open.has(s.id)?" open":""}><summary>History &amp; settings (${ws.length} weights, ${trimsFor(s.id).length} trims, ${vetFor(s.id).length} vet)</summary>
        ${ws.length ? `<div class="sub">Weights</div><table><tr><th>Date</th><th>Lb</th><th>ADG</th><th></th></tr>${rows}</table>` : ""}
        ${trimsFor(s.id).length ? `<div class="sub">Hoof trims</div><table><tr><th>Date</th><th>Note</th><th></th></tr>${
          trimsFor(s.id).slice().reverse().map(t=>`<tr><td>${fmtShort(parseDate(t.date))}, ${t.date.slice(0,4)}</td><td>${esc(t.note||"—")}</td><td><button class="ghost tiny" data-delt="${t.id}">✕</button></td></tr>`).join("")
        }</table>` : ""}
        ${vetFor(s.id).length ? `<div class="sub">Vet log</div><table><tr><th>Date</th><th>Type</th><th>Product / notes</th><th>W/D</th><th></th></tr>${
          vetFor(s.id).slice().reverse().map(v=>`<tr><td>${fmtShort(parseDate(v.date))}, ${v.date.slice(0,4)}</td><td>${esc(v.type)}</td><td>${esc([v.product,v.note].filter(Boolean).join(" · ")||"—")}</td><td>${Number(v.withdraw)>0?`${v.withdraw}d → ${fmtShort(clearDate(v))}`:"—"}</td><td><button class="ghost tiny" data-delv="${v.id}">✕</button></td></tr>`).join("")
        }</table>` : ""}
        <div class="tools">
          <select data-show="${s.id}" aria-label="Target show">${showOpts(s.show)}</select>
          <button class="ghost tiny" data-target="${s.id}">Set target weight</button>
          <button class="ghost tiny" data-lead="${s.id}">Set trim target</button>
          <button class="ghost tiny" data-dels="${s.id}">Remove steer</button>
        </div>
      </details>
    </div>`;
  }).join("") : `<div class="panel empty">No steers yet. Use “+ Add a steer” above to get started.</div>`;
}

// Buttons use click handlers (not form submission) so they work everywhere,
// including embedded/sandboxed previews where form submits are blocked.
function onEnter(form, fn){
  $(form).addEventListener("submit", e=>{ e.preventDefault(); fn(); });
  $(form).addEventListener("keydown", e=>{ if(e.key==="Enter" && e.target.tagName==="INPUT"){ e.preventDefault(); fn(); } });
}
function addSteer(){
  const name = $("sName").value.trim();
  if(!name){ flash("Type a steer name or tag first.", true); $("sName").focus(); return; }
  const s = { id: uid(), name, owner: $("sOwner").value.trim(), target: Number($("sTarget").value)||null, show: $("sShow").value || "",
    trimLead: $("sLead").value==="" ? null : Number($("sLead").value) };
  $("sForm").reset();
  change({ t:"addSteer", steer:s }, `Added ${name}.`);
  $("wSteer").value = s.id;
}
$("sBtn").addEventListener("click", addSteer);
onEnter("sForm", addSteer);

function addWeight(){
  const steerId = $("wSteer").value, date = $("wDate").value, lbs = Number($("wLbs").value);
  if(!steerId){ flash("Add a steer first.", true); return; }
  if(!date){ flash("Pick a date.", true); return; }
  if(!lbs || lbs < 50){ flash("Enter a weight in pounds.", true); $("wLbs").focus(); return; }
  const dup = db.weights.find(w=>w.steerId===steerId && w.date===date);
  const s = db.steers.find(x=>x.id===steerId);
  $("wLbs").value = "";
  change({ t:"addWeight", w:{ id: uid(), steerId, date, lbs } }, `${dup?"Updated":"Saved"} ${num(lbs)} lb for ${s.name}.`);
}
$("wBtn").addEventListener("click", addWeight);
onEnter("wForm", addWeight);

function addTrim(){
  const steerId = $("tSteer").value, date = $("tDate").value, note = $("tNote").value.trim();
  if(!steerId){ flash("Add a steer first.", true); return; }
  if(!date){ flash("Pick the date you trimmed.", true); return; }
  const s = db.steers.find(x=>x.id===steerId);
  $("tNote").value = "";
  change({ t:"addTrim", tr:{ id: uid(), steerId, date, note } }, `Saved hoof trim for ${s.name} on ${fmtShort(parseDate(date))}.`);
}
$("tBtn").addEventListener("click", addTrim);
onEnter("tForm", addTrim);

function addVet(){
  const steerId = $("vSteer").value, date = $("vDate").value;
  if(!steerId){ flash("Add a steer first.", true); return; }
  if(!date){ flash("Pick a date.", true); return; }
  const product = $("vProduct").value.trim(), note = $("vNote").value.trim();
  const wdRaw = $("vWd").value, withdraw = wdRaw==="" ? 0 : Math.max(0, Math.round(Number(wdRaw))||0);
  const s = db.steers.find(x=>x.id===steerId), type = $("vType").value;
  ["vProduct","vNote","vWd"].forEach(id=>$(id).value="");
  const v = { id: uid(), steerId, date, type, product, withdraw, note };
  let msg = `Saved ${type.toLowerCase()} for ${s.name}.`;
  if(withdraw) msg += ` Withdrawal clears ${fmtShort(clearDate(v))}.`;
  change({ t:"addVet", v }, msg);
}
$("vBtn").addEventListener("click", addVet);
onEnter("vForm", addVet);

$("steers").addEventListener("click", e=>{
  const b = e.target.closest("button"); if(!b) return;
  if(b.dataset.delw){
    if(!confirm("Delete this weight?")) return;
    change({ t:"delWeight", id:b.dataset.delw });
  } else if(b.dataset.dels){
    const s = db.steers.find(x=>x.id===b.dataset.dels);
    if(!confirm(`Remove ${s.name} and all of their weights? This removes it for everyone.`)) return;
    change({ t:"removeSteer", id:s.id }, `Removed ${s.name}.`);
  } else if(b.dataset.delv){
    if(!confirm("Delete this vet entry?")) return;
    change({ t:"delVet", id:b.dataset.delv });
  } else if(b.dataset.delt){
    if(!confirm("Delete this hoof trim?")) return;
    change({ t:"delTrim", id:b.dataset.delt });
  } else if(b.dataset.lead){
    const s = db.steers.find(x=>x.id===b.dataset.lead);
    const v = prompt(`Trim ${s.name}'s hooves how many days before the show? Leave blank to clear.`, s.trimLead??"");
    if(v===null) return;
    change({ t:"setLead", id:s.id, lead: v.trim()==="" ? null : Math.max(0, Math.round(Number(v))||0) });
  } else if(b.dataset.target){
    const s = db.steers.find(x=>x.id===b.dataset.target);
    const v = prompt(`Target show weight for ${s.name} (lb). Leave blank to clear.`, s.target||"");
    if(v===null) return;
    change({ t:"setTarget", id:s.id, target: Number(v)||null });
  }
});

$("steers").addEventListener("change", e=>{

/* ---------------- CSV backup ---------------- */
const csvCell = v => /[",\n]/.test(String(v??"")) ? `"${String(v).replace(/"/g,'""')}"` : String(v??"");
$("expBtn").addEventListener("click", ()=>{
  const lines = ["steer,exhibitor,target_lb,date,weight_lb,target_show,trim_days_before_show,record,note,vet_type,product,withdrawal_days"];
  db.steers.forEach(s=>{
    const ws = weightsFor(s.id), ts = trimsFor(s.id), lead = s.trimLead ?? "";
    const head = [s.name,s.owner,s.target||""];
    if(!ws.length && !ts.length) lines.push([...head,"","",s.show||"",lead,"",""].map(csvCell).join(","));
    ws.forEach(w=>lines.push([...head,w.date,w.lbs,s.show||"",lead,"weight",""].map(csvCell).join(",")));
    ts.forEach(t=>lines.push([...head,t.date,"",s.show||"",lead,"trim",t.note||""].map(csvCell).join(",")));
    vetFor(s.id).forEach(v=>lines.push([...head,v.date,"",s.show||"",lead,"vet",v.note||"",v.type,v.product||"",v.withdraw||0].map(csvCell).join(",")));
  });
  const blob = new Blob([lines.join("\n")], {type:"text/csv"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = `steer-weights-${isoToday()}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
});
$("impBtn").addEventListener("click", ()=> $("impFile").click());
$("impFile").addEventListener("change", async e=>{
  const f = e.target.files[0]; if(!f) return;
  const text = await f.text();
  const parseLine = l => { const out=[]; let cur="",q=false;
    for(let i=0;i<l.length;i++){ const c=l[i];
      if(q){ if(c==='"'&&l[i+1]==='"'){cur+='"';i++;} else if(c==='"') q=false; else cur+=c; }
      else if(c==='"') q=true; else if(c===','){out.push(cur);cur="";} else cur+=c; }
    out.push(cur); return out; };
  const rows = [];
  text.split(/\r?\n/).slice(1).filter(l=>l.trim()).forEach(l=>{
    const [name,owner,target,date,lbs,tshow,lead,record,note,vtype,product,wd] = parseLine(l).map(x=>x.trim());
    if(!name) return;
    const okDate = date && /^\d{4}-\d{2}-\d{2}$/.test(date);
    const rec = (record||"").toLowerCase(), isTrim = rec==="trim" || rec==="vet";
    const okW = okDate && Number(lbs);
    rows.push({ name, owner, target: Number(target)||null, show: tshow||"",
      lead: lead==="" || lead==null ? null : Number(lead), record: rec==="vet" ? "vet" : (rec==="trim" ? "trim" : "weight"), note: note||"",
      vtype: vtype||"", product: product||"", wd: Number(wd)||0,
      date: (isTrim ? okDate : okW) ? date : "", lbs: okW ? Number(lbs) : 0, newSteerId: uid(), newWeightId: uid() });
  });
  e.target.value = "";
  const n = rows.filter(r=>r.lbs).length, m = rows.filter(r=>r.record==="trim" && r.date).length, v = rows.filter(r=>r.record==="vet" && r.date).length;
  change({ t:"importRows", rows }, `Imported ${plural(n,"weight")}, ${plural(m,"hoof trim")} and ${plural(v,"vet entry").replace("entrys","entries")}.`);
});

/* ---------------- start ---------------- */
loadLocal();
renderCountdown();
setInterval(renderCountdown, 1000);
pull().then(ok=>{ if(ok) push(); });
// check for changes from other devices every 20 seconds, and whenever the page comes back into view
setInterval(()=>{ if(!pushing) pull().then(ok=>{ if(ok && pending.length) push(); }); }, 20000);
document.addEventListener("visibilitychange", ()=>{ if(!document.hidden) pull().then(ok=>{ if(ok && pending.length) push(); }); });
</script>
